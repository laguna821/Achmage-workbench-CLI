[package]
name = "achmage-workbench"
version = "0.2.2"
description = "Achmage Workbench desktop shell"
edition = "2021"

[lib]
name = "achmage_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
url = "2"

# Notifications that report a click (the "default" action of freedesktop notification servers),
# the same crate and version tauri-plugin-notification already uses.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
