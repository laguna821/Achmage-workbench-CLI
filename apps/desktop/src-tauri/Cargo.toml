[package]
name = "achmage-workbench"
version = "0.1.0"
description = "Achmage Workbench desktop shell"
edition = "2021"

[lib]
name = "achmage_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
