[package]
name = "achmage-workbench"
version = "0.2.2"
description = "Achmage Workbench desktop shell"
edition = "2021"

[lib]
name = "achmage_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
svg2pdf = "=0.13.0"
pdf-writer = "=0.12.1"
roxmltree = "0.20"
url = "2"
portable-pty = "=0.9.0"
base64 = "0.22"
getrandom = "=0.3.4"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Notifications that report a click (the "default" action of freedesktop notification servers),
# the same crate and version tauri-plugin-notification already uses.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
