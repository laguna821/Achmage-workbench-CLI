# Installers for Windows, macOS (Apple silicon), Linux (AppImage and .deb) and Arch Linux /
# CachyOS (.pkg.tar.zst). The UI and the gateway are the same everywhere, so they are built once
# on Linux (with the IeumOffice editors and the xlsx engine's WebAssembly) and every platform
# then builds only its desktop shell around them. Windows, macOS and the AppImage carry their own
# Node.js 24 for the gateway and the npm of the same Node release (one-click engine installs);
# the Arch package uses the system's. HWP/PDF use the embedded Ieum engines. The remaining
# document tools are the hallym-kordoc default skill (third_party/skills) and the original IeumOffice CLI engines
# (packaging/bundled-apps.json); separate Electron/HOP/PDFCraft applications are not shipped.
# Runs by hand (Actions › release › Run workflow) or for a version tag (v*), which also makes a
# GitHub release with the installers; the first-run check (job smoke) installs the Windows and
# macOS builds and runs them with stand-in engines.

name: Installers
run-name: ${{ inputs.upgrade_to && format('Upgrade {0} → {1}', inputs.upgrade_from, inputs.upgrade_to) || (inputs.publish_run && format('Publish tested installers · {0}', inputs.publish_run) || (startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || format('Test installers · {0}', github.ref_name))) }}

on:
  workflow_dispatch:
    inputs:
      publish_run:
        description: 'Publish an already successful Installers run as a preview (empty: build)'
        type: string
        default: ''
      preview_tag:
        description: 'New preview-* tag for an existing run'
        type: string
        default: ''
      source_sha:
        description: 'Exact commit of the existing successful run'
        type: string
        default: ''
      upgrade_from:
        description: 'Published release to install before the upgrade check'
        type: string
        default: 'v0.2.2'
      upgrade_to:
        description: 'Published release to install over the old version (empty: normal build/publish)'
        type: string
        default: ''
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

env:
  NODE_DIST: https://nodejs.org/dist/latest-v24.x

jobs:
  browser:
    if: ${{ !inputs.publish_run && !inputs.upgrade_to }}
    name: Lightpanda background browsing (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download, verify and exercise the official engine through Workbench
        run: node scripts/check-lightpanda.ts --install lightpanda-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightpanda-${{ matrix.os }}
          path: lightpanda-check.json
          if-no-files-found: ignore

  web:
    if: ${{ !inputs.publish_run && !inputs.upgrade_to }}
    name: UI and gateway (once)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: npm ci --ignore-scripts
      - name: Build (IeumOffice checkout, xlsx engine, UI, editors, gateway)
        run: npm run build
      - name: Typecheck and tests
        run: |
          npm run typecheck
          npx vitest run
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            apps/web/dist
            apps/host/dist
          if-no-files-found: error

  linux:
    name: Linux (AppImage, deb)
    needs: web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps
      - name: Node.js for the gateway
        run: |
          file=$(curl -fsSL "$NODE_DIST/SHASUMS256.txt" | awk '/linux-x64.tar.xz$/ {print $2}')
          curl -fsSLO "$NODE_DIST/$file"
          curl -fsSL "$NODE_DIST/SHASUMS256.txt" | grep " $file\$" | sha256sum -c -
          tar -xJf "$file"
          mkdir -p apps/desktop/src-tauri/node
          cp "${file%.tar.xz}/bin/node" apps/desktop/src-tauri/node/node
          # npm from the same checked release, beside node (node/npm/bin/npm-cli.js).
          cp -R "${file%.tar.xz}/lib/node_modules/npm" apps/desktop/src-tauri/node/npm
      - name: Original IeumOffice CLI resources (official Linux builds, pinned and checked)
        run: node scripts/fetch-bundled-apps.ts apps/desktop/src-tauri/bundled linux-x64
      - run: npm ci --ignore-scripts
      # The AppImage keeps the document apps in usr/share/achmage-workbench, where linuxdeploy does
      # not walk: it would otherwise try to resolve the old GTK2 tray libraries inside IeumOffice's
      # own build and stop. Built first, from a clean bundle folder; the .deb keeps them as resources.
      - name: Build (AppImage)
        working-directory: apps/desktop
        run: npx tauri build --verbose --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.appimage.conf.json --bundles appimage
      - name: Build (deb)
        working-directory: apps/desktop
        run: npx tauri build --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.apps.conf.json --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  arch:
    name: Arch Linux / CachyOS (pacman)
    needs: web
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: System packages
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm rust webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg openssl
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps
      - run: npm ci --ignore-scripts
      - name: Original IeumOffice CLI resources (official Linux builds, pinned and checked)
        run: node scripts/fetch-bundled-apps.ts apps/desktop/src-tauri/bundled linux-x64
      - name: "Build (no bundle: the binary with host/, web/ and skills/ beside it)"
        working-directory: apps/desktop
        run: npx tauri build --no-bundle
      - name: Package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder makepkg --nodeps --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  windows:
    name: Windows (NSIS, MSI)
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps
      - name: Node.js for the gateway
        shell: bash
        run: |
          file=$(curl -fsSL "$NODE_DIST/SHASUMS256.txt" | awk '/win-x64.zip$/ {print $2}')
          curl -fsSLO "$NODE_DIST/$file"
          curl -fsSL "$NODE_DIST/SHASUMS256.txt" | grep " $file\$" | sha256sum -c -
          unzip -q "$file"
          mkdir -p apps/desktop/src-tauri/node
          cp "${file%.zip}/node.exe" apps/desktop/src-tauri/node/node.exe
          # npm from the same checked release, beside node.exe (node/npm/bin/npm-cli.js).
          cp -R "${file%.zip}/node_modules/npm" apps/desktop/src-tauri/node/npm
      - name: Original IeumOffice CLI resources (official Windows builds, pinned and checked; 7-Zip opens the installers)
        run: node scripts/fetch-bundled-apps.ts apps/desktop/src-tauri/bundled win32-x64
      - run: npm ci --ignore-scripts
      - name: Build
        working-directory: apps/desktop
        run: npx tauri build --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.apps.conf.json --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  macos:
    name: macOS (Apple silicon, dmg)
    needs: web
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps
      - name: Node.js for the gateway
        run: |
          file=$(curl -fsSL "$NODE_DIST/SHASUMS256.txt" | awk '/darwin-arm64.tar.gz$/ {print $2}')
          curl -fsSLO "$NODE_DIST/$file"
          curl -fsSL "$NODE_DIST/SHASUMS256.txt" | grep " $file\$" | shasum -a 256 -c -
          tar -xzf "$file"
          mkdir -p apps/desktop/src-tauri/node
          cp "${file%.tar.gz}/bin/node" apps/desktop/src-tauri/node/node
          # npm from the same checked release, beside node (node/npm/bin/npm-cli.js).
          cp -R "${file%.tar.gz}/lib/node_modules/npm" apps/desktop/src-tauri/node/npm
      - name: Original IeumOffice CLI resources (official Apple silicon builds, pinned and checked)
        run: node scripts/fetch-bundled-apps.ts apps/desktop/src-tauri/bundled darwin-arm64
      - run: npm ci --ignore-scripts
      - name: Build
        working-directory: apps/desktop
        # CLI engines use the same resources layout on every OS; no nested Electron .app.
        run: npx tauri build --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.macos.conf.json --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  smoke:
    name: First run on ${{ matrix.os }} (engines found, bundled document tools)
    # Only where the workflow runs at all (by hand or for a tag), stated for when triggers change.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-15
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer
      - name: Install for this user (NSIS, silent)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Achmage Workbench'
          Get-ChildItem $app | Select-Object Name
          "APP_DIR=$app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install from the disk image
        if: runner.os == 'macOS'
        run: |
          dmg=$(find installer -name '*.dmg' | head -1)
          hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/wb-dmg
          mkdir -p "$HOME/Applications"
          ditto "/tmp/wb-dmg/Achmage Workbench.app" "$HOME/Applications/Achmage Workbench.app"
          hdiutil detach /tmp/wb-dmg
          ls "$HOME/Applications/Achmage Workbench.app/Contents/Resources"
          echo "APP_DIR=$HOME/Applications/Achmage Workbench.app/Contents/Resources" >> "$GITHUB_ENV"
      - name: First run with stand-in engines (npm's codex.cmd shim on Windows, Homebrew on macOS)
        shell: bash
        run: node scripts/setup-smoke.ts "$APP_DIR" smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.artifact }}
          path: smoke-out
          if-no-files-found: ignore

  upgrade:
    name: Windows installer upgrade and data preservation
    needs: windows
    if: always() && inputs.publish_run == '' && (inputs.upgrade_to != '' || needs.windows.result == 'success')
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      UPGRADE_FROM: ${{ inputs.upgrade_from || 'v0.2.2' }}
      UPGRADE_TO: ${{ inputs.upgrade_to }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the published old version and create real application data
        shell: pwsh
        run: |
          if ($env:UPGRADE_FROM -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$' -or ($env:UPGRADE_TO -and $env:UPGRADE_TO -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$')) { throw 'Invalid release tag' }
          gh release download $env:UPGRADE_FROM --repo $env:GITHUB_REPOSITORY --pattern '*-setup.exe' --dir old-installer
          if ($LASTEXITCODE -ne 0) { throw 'Old installer download failed' }
          $files = @(Get-ChildItem old-installer -Filter '*-setup.exe')
          if ($files.Count -ne 1) { throw 'Expected one old NSIS installer' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:UPGRADE_FROM" | ConvertFrom-Json
          $asset = @($release.assets | Where-Object name -eq $files[0].Name)
          $hash = 'sha256:' + (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLower()
          if ($release.draft -or $asset.Count -ne 1 -or $asset[0].digest -ne $hash) { throw 'Old published asset digest mismatch' }
          $installer = Start-Process -FilePath $files[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Old installation failed: $($installer.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Achmage Workbench'
          $fixture = Join-Path $env:RUNNER_TEMP "wb-upgrade-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force upgrade-out | Out-Null
          @{tag=$env:UPGRADE_FROM;sha256=$hash;version=(Get-Item (Join-Path $app 'achmage-workbench.exe')).VersionInfo.ProductVersion} | ConvertTo-Json | Set-Content upgrade-out/old-installer.json
          "APP_DIR=$app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "UPGRADE_FIXTURE=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          node scripts/upgrade-smoke.ts seed "$app" "$fixture" upgrade-out
          if ($LASTEXITCODE -ne 0) { throw 'Old application data preparation failed' }
      - uses: actions/download-artifact@v4
        if: inputs.upgrade_to == ''
        with:
          name: windows
          path: new-installer
      - name: Install the new version over the same installation and verify
        shell: pwsh
        run: |
          if ($env:UPGRADE_TO) {
            gh release download $env:UPGRADE_TO --repo $env:GITHUB_REPOSITORY --pattern '*-setup.exe' --dir new-installer
            if ($LASTEXITCODE -ne 0) { throw 'New installer download failed' }
          }
          $files = @(Get-ChildItem new-installer -Recurse -Filter '*-setup.exe')
          if ($files.Count -ne 1) { throw 'Expected one new NSIS installer' }
          $hash = 'sha256:' + (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLower()
          if ($env:UPGRADE_TO) {
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:UPGRADE_TO" | ConvertFrom-Json
            $asset = @($release.assets | Where-Object name -eq $files[0].Name)
            if ($release.draft -or $asset.Count -ne 1 -or $asset[0].digest -ne $hash) { throw 'New published asset digest mismatch' }
          }
          $installer = Start-Process -FilePath $files[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "New installation failed: $($installer.ExitCode)" }
          @{tag=$env:UPGRADE_TO;sha256=$hash;version=(Get-Item (Join-Path $env:APP_DIR 'achmage-workbench.exe')).VersionInfo.ProductVersion} | ConvertTo-Json | Set-Content upgrade-out/new-installer.json
          node scripts/upgrade-smoke.ts verify "$env:APP_DIR" "$env:UPGRADE_FIXTURE" upgrade-out
          if ($LASTEXITCODE -ne 0) { throw 'Upgraded application verification failed' }
          Copy-Item (Join-Path $env:APP_DIR 'legacy-cleanup.json') upgrade-out/legacy-cleanup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-windows
          path: upgrade-out
          if-no-files-found: ignore

  publish-tested:
    name: Publish successful installers without rebuilding
    if: github.event_name == 'workflow_dispatch' && inputs.publish_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.publish_run }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PREVIEW_TAG: ${{ inputs.preview_tag }}
    steps:
      - name: Verify source run and download its installers
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREVIEW_TAG" =~ ^preview-[a-zA-Z0-9._-]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > run.json
          python3 - <<'PY'
          import json, os
          r = json.load(open('run.json'))
          assert r['head_sha'] == os.environ['SOURCE_SHA'], 'Source commit changed'
          assert r['status'] == 'completed' and r['conclusion'] == 'success', 'Run has not passed'
          assert r['path'] == '.github/workflows/release.yml', 'Wrong workflow'
          assert r['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY'], 'Wrong source repository'
          PY
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" -D out \
            -n windows -n macos -n linux -n arch \
            -n smoke-windows -n smoke-macos -n upgrade-windows
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" -D out -p 'lightpanda-*'
      - name: Verify evidence and upload to prepared draft
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          files = sorted(p for p in Path('out').rglob('*') if p.is_file() and any(str(p).endswith(s) for s in ('.exe', '.msi', '.dmg', '.deb', '.AppImage', '.pkg.tar.zst')))
          assert len(files) == 6 and len({p.name for p in files}) == 6, 'Expected six unique installers'
          for suffix in ('.exe', '.msi', '.dmg', '.deb', '.AppImage', '.pkg.tar.zst'):
              assert sum(str(p).endswith(suffix) for p in files) == 1, suffix
          checks = {}
          for platform in ('windows', 'macos'):
              rows = json.loads(Path(f'out/smoke-{platform}/setup-smoke.json').read_text())
              assert len(rows) >= 18 and all(r.get('ok') is True for r in rows), platform
              checks[platform] = len(rows)
          upgrade = json.loads(Path('out/upgrade-windows/verify-results.json').read_text())
          assert len(upgrade) >= 17 and all(r.get('ok') is True for r in upgrade), 'Windows upgrade has not passed'
          upgrade_size = json.loads(Path('out/upgrade-windows/after-summary.json').read_text())
          assert upgrade_size['remainingLegacyFiles'] == [], 'Obsolete application files remain'
          assets = []
          for p in files:
              with p.open('rb') as f:
                  digest = hashlib.file_digest(f, 'sha256').hexdigest()
              # GitHub normalizes the spaces in these installer names to dots on upload.
              assets.append({'name': p.name.replace(' ', '.'), 'artifactName': p.name, 'bytes': p.stat().st_size, 'sha256': digest})
          Path('SHA256SUMS.txt').write_text(''.join(f"{a['sha256']}  {a['name']}\n" for a in assets))
          upgraded_installer = json.loads(Path('out/upgrade-windows/new-installer.json').read_text(encoding='utf-8-sig'))
          assert upgraded_installer['sha256'] == 'sha256:' + next(a['sha256'] for a in assets if a['name'].endswith('-setup.exe')), 'Upgrade tested a different installer'
          proof = {'sourceRun': os.environ['SOURCE_RUN'], 'sourceSha': os.environ['SOURCE_SHA'], 'installedFirstRunChecks': checks, 'windowsUpgradeChecks': len(upgrade), 'windowsUpgrade': upgrade_size, 'assets': assets}
          Path('installer-provenance.json').write_text(json.dumps(proof, ensure_ascii=False, indent=2) + '\n')
          repo, sha, run = (os.environ[k] for k in ('GITHUB_REPOSITORY', 'SOURCE_SHA', 'SOURCE_RUN'))
          size = json.loads(Path('out/smoke-windows/installed-size.json').read_text())['installedFileBytes']
          version_note = ''
          if sha == 'f36afbb03b9fce3a0b729df75e6d6802c9d5455f':
              version_note = '''- 파일명과 앱 안의 버전이 `0.2.2`여도 이전 공개 `v0.2.2`와 다른 코드입니다. 이번 시험본은 위 커밋으로 구분합니다.
          - 이 빌드 이후의 위키·지식베이스 연결과 Sheets/XMind 후속 수정은 포함하지 않습니다.'''
          body = f'''전체 통합 작업이 끝나기 전에 직접 설치해 볼 수 있도록 공개하는 시험 설치본입니다.

          - Windows: `*-setup.exe` 권장. macOS: Apple silicon용 `.dmg`. Linux: `.AppImage`/`.deb`, Arch/CachyOS: `.pkg.tar.zst`.
          - 실제 포함 코드: [{sha[:7]}](https://github.com/{repo}/commit/{sha}). 최신 개발 브랜치와는 다를 수 있습니다.
          - [성공한 설치본 빌드](https://github.com/{repo}/actions/runs/{run})의 파일을 변경 없이 공개했습니다.
          - Windows/macOS 설치 후 실행 검사 각 {checks['windows']}/{checks['macos']}개 통과. 문서 엔진 실행과 출력 검사를 포함하며 AI 응답은 시험용 엔진을 사용했습니다.
          - Windows 설치 디렉터리 파일 합계: {size:,} bytes (약 {size / 1024**2:.0f}MiB). 사용자 자료와 시스템 WebView 등은 별도입니다.
          - 실제 공개 v0.2.2에서 만든 프로젝트·대화·문서·설정을 같은 위치에 업데이트하는 Windows EXE 검사 {len(upgrade)}개를 통과했습니다. 구형 중복 번들을 정리하고 사용자가 추가·수정한 파일은 보존합니다.
          - 전체 기능 완료판은 아닙니다. 다른 OS의 구형 설치 업그레이드와 기존 WebView 프로필 전체 인수는 후속 범위입니다.
          {version_note}

          | 설치 파일 | 다운로드 크기 |
          |---|---:|
          '''
          body += ''.join(f"| `{a['name']}` | {a['bytes'] / 1024**2:.1f}MiB |\n" for a in assets)
          Path('preview-notes.md').write_text('\n'.join(line.strip() for line in body.splitlines()) + '\n')
          PY
          mapfile -t files < <(find out -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.pkg.tar.zst' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \))
          # A maintainer creates the draft with their authenticated gh before dispatching.
          # GITHUB_TOKEN can upload these assets, but release creation for this historical
          # source returned 403 even with Contents:write and an existing exact source tag.
          gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease > draft.json
          python3 -c 'import json; d=json.load(open("draft.json")); assert d["isDraft"] and d["isPrerelease"], "Expected an unpublished preview draft"'
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$PREVIEW_TAG" --jq .object.sha)
          test "$tag_sha" = "$SOURCE_SHA"
          gh release upload "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" \
            "${files[@]}" SHA256SUMS.txt installer-provenance.json preview-notes.md

  release:
    name: GitHub release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [browser, linux, arch, windows, macos, smoke, upgrade]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # The installers' names have a space ("Achmage Workbench_…"): kept whole, not split into words.
        run: |
          mapfile -t files < <(find out -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.pkg.tar.zst' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \))
          test "${#files[@]}" -eq 6
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Achmage Workbench $GITHUB_REF_NAME" --generate-notes "${files[@]}"
