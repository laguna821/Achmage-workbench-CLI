# Installers for Windows, macOS (Apple silicon), Linux (AppImage and .deb) and Arch Linux /
# CachyOS (.pkg.tar.zst). The UI and the gateway are the same everywhere, so they are built once
# on Linux (with the IeumOffice editors and the xlsx engine's WebAssembly) and every platform
# then builds only its desktop shell around them. Windows, macOS and the AppImage carry their own
# Node.js 24 for the gateway and the npm of the same Node release (one-click engine installs);
# the Arch package uses the system's. HWP/PDF use the embedded Ieum engines. The remaining
# document tools are the hallym-kordoc default skill (third_party/skills) and the original IeumOffice CLI engines
# (packaging/bundled-apps.json); separate Electron/HOP/PDFCraft applications are not shipped.
# Runs by hand (Actions › Installers › Run workflow). Candidate files and their receipts
# are retained before an explicit promotion; a version tag never rebuilds or publishes files.
# First-run checks install Windows/macOS candidates with stand-in engines.

name: Installers
run-name: ${{ inputs.upgrade_to && format('Upgrade {0} → {1}', inputs.upgrade_from, inputs.upgrade_to) || (inputs.publish_run && format('Publish tested installers · {0}', inputs.publish_run) || format('Candidate installers · {0}', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      smoke_run:
        description: 'Recheck existing installers using current acceptance scripts (empty: build)'
        type: string
        default: ''
      smoke_os:
        description: 'OS to recheck for smoke_run (normal builds always check both)'
        type: choice
        options: [both, windows-latest, macos-15]
        default: both
      upgrade_run:
        description: 'Recheck upgrade using installers from an existing build run (requires source_sha)'
        type: string
        default: ''
      publish_run:
        description: 'Upload an accepted Installers run to a prepared release draft (empty: build)'
        type: string
        default: ''
      preview_tag:
        description: 'Prepared preview-* or vMAJOR.MINOR.PATCH tag for an existing run'
        type: string
        default: ''
      source_sha:
        description: 'Exact commit of the existing successful run'
        type: string
        default: ''
      upgrade_from:
        description: 'Published release to install before the upgrade check'
        type: string
        default: 'v0.5.1'
      upgrade_to:
        description: 'Published release to install over the old version (empty: normal build/publish)'
        type: string
        default: ''

permissions:
  contents: write
  actions: read

env:
  NODE_DIST: https://nodejs.org/dist/latest-v24.x
  WORKBENCH_GOOGLE_CLIENT_ID: ${{ secrets.WORKBENCH_GOOGLE_CLIENT_ID }}
  WORKBENCH_GOOGLE_CLIENT_SECRET: ${{ secrets.WORKBENCH_GOOGLE_CLIENT_SECRET }}

jobs:
  validate:
    name: Select one explicit installer operation
    runs-on: ubuntu-24.04
    steps:
      - name: Validate inputs before starting builds
        env:
          SMOKE_RUN: ${{ inputs.smoke_run }}
          UPGRADE_RUN: ${{ inputs.upgrade_run }}
          UPGRADE_TO: ${{ inputs.upgrade_to }}
          PUBLISH_RUN: ${{ inputs.publish_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREVIEW_TAG: ${{ inputs.preview_tag }}
        run: |
          node --input-type=module - <<'JS'
          const e = process.env;
          const modes = ['SMOKE_RUN', 'UPGRADE_RUN', 'UPGRADE_TO', 'PUBLISH_RUN'].filter(k => e[k]);
          if (modes.length > 1) throw Error('Choose build, first-run recheck, upgrade or promotion; do not combine them');
          for (const key of ['SMOKE_RUN', 'UPGRADE_RUN', 'PUBLISH_RUN']) if (e[key] && !/^\d+$/.test(e[key])) throw Error(`Invalid ${key}`);
          if (modes.some(k => k.endsWith('_RUN')) && !/^[a-f0-9]{40}$/.test(e.SOURCE_SHA ?? '')) throw Error('An exact source SHA is required');
          if (e.PUBLISH_RUN && !/^(preview-[a-zA-Z0-9._-]+|v\d+\.\d+\.\d+)$/.test(e.PREVIEW_TAG ?? '')) throw Error('A prepared release tag is required');
          JS

  browser:
    needs: validate
    if: ${{ !inputs.publish_run && !inputs.upgrade_to && !inputs.smoke_run && !inputs.upgrade_run }}
    name: Lightpanda background browsing (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download, verify and exercise the official engine through Workbench
        run: node scripts/check-lightpanda.ts --install lightpanda-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightpanda-${{ matrix.os }}
          path: lightpanda-check.json
          if-no-files-found: ignore

  web:
    needs: validate
    if: ${{ !inputs.publish_run && !inputs.upgrade_to && !inputs.smoke_run && !inputs.upgrade_run }}
    name: UI and gateway (once)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: npm ci --ignore-scripts
      - name: Build and verify the shared native Fast Find engine
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/workbench-search-target
          CARGO_BUILD_JOBS: 2
        run: |
          node scripts/check-fast-find-sources.mjs
          cargo test --locked --release --manifest-path third_party/fast-find/crates/ff10k-core/Cargo.toml --features golden -- --test-threads=1
          cargo build --locked --release --manifest-path apps/desktop/search-worker/Cargo.toml
          echo "WORKBENCH_SEARCH_WORKER_BIN=$CARGO_TARGET_DIR/release/workbench-search-worker" >> "$GITHUB_ENV"
      # Before the build: the office build runs the built studio in this headless Chromium to prove
      # the save report still reaches its document (scripts/check-hwp-studio-report.ts).
      - name: Headless Chromium (office build check, urgent UI checks)
        run: node node_modules/playwright-core/cli.js install --with-deps chromium --only-shell
      - name: Build (IeumOffice checkout, xlsx engine, UI, editors, gateway)
        run: npm run build
      - name: Typecheck and tests
        env:
          WORKBENCH_HOST_BUNDLE_READY: '1'
        run: |
          npm run typecheck
          npx vitest run
      - name: Multi-tab document AI and urgent UI checks
        run: node scripts/urgent-parallel-check.ts urgent-ui
      # The in-app update proofs (job update-proof) need an OLDER gateway of this same commit that trusts a key
      # made here for this run only (version 0.0.1, WORKBENCH_UPDATE_TEST_KEYS at BUILD time). The release
      # gateway above is built without it and trusts only the keys in apps/host/src/app-update/manifest.ts.
      - name: Older test gateway and throwaway key for the in-app update proofs
        run: |
          mkdir -p update-proof-kit
          node --input-type=module -e "import { generateKeyPairSync } from 'node:crypto'; import { writeFileSync } from 'node:fs'; const { privateKey, publicKey } = generateKeyPairSync('ed25519'); writeFileSync('update-proof-kit/proof-key.pem', privateKey.export({ format: 'pem', type: 'pkcs8' })); writeFileSync('update-proof-kit/proof-key.spki', publicKey.export({ format: 'der', type: 'spki' }).toString('base64'));"
          cd apps/host
          WORKBENCH_HOST_BUILD_DIR="$GITHUB_WORKSPACE/update-proof-kit/host" WORKBENCH_BUILD_VERSION=0.0.1 WORKBENCH_UPDATE_TEST_KEYS="$(cat ../../update-proof-kit/proof-key.spki)" node ../../scripts/build-host.mjs
          test -f "$GITHUB_WORKSPACE/update-proof-kit/host/update-helper.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: update-proof-kit
          path: update-proof-kit
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: urgent-ui
          path: urgent-ui
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            apps/web/dist
            apps/host/dist
          if-no-files-found: error

  linux:
    name: Linux (AppImage, deb)
    needs: web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps
      - name: Node.js for the gateway
        run: |
          file=$(curl -fsSL "$NODE_DIST/SHASUMS256.txt" | awk '/linux-x64.tar.xz$/ {print $2}')
          curl -fsSLO "$NODE_DIST/$file"
          curl -fsSL "$NODE_DIST/SHASUMS256.txt" | grep " $file\$" | sha256sum -c -
          tar -xJf "$file"
          mkdir -p apps/desktop/src-tauri/node
          cp "${file%.tar.xz}/bin/node" apps/desktop/src-tauri/node/node
          # npm from the same checked release, beside node (node/npm/bin/npm-cli.js).
          cp -R "${file%.tar.xz}/lib/node_modules/npm" apps/desktop/src-tauri/node/npm
      - name: Original IeumOffice CLI resources (official Linux builds, pinned and checked)
        run: node scripts/fetch-bundled-apps.ts apps/desktop/src-tauri/bundled linux-x64
      - run: npm ci --ignore-scripts
      # The AppImage keeps the document apps in usr/share/achmage-workbench, where linuxdeploy does
      # not walk: it would otherwise try to resolve the old GTK2 tray libraries inside IeumOffice's
      # own build and stop. Built first, from a clean bundle folder; the .deb keeps them as resources.
      - name: Build (AppImage)
        working-directory: apps/desktop
        run: npx tauri build --verbose --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.appimage.conf.json --bundles appimage
      - name: Build (deb)
        working-directory: apps/desktop
        run: npx tauri build --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.apps.conf.json --config src-tauri/tauri.release.deb.conf.json --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  arch:
    name: Arch Linux / CachyOS (pacman)
    needs: web
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: System packages
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm rust webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg openssl
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps
      - run: npm ci --ignore-scripts
      - name: Original IeumOffice CLI resources (official Linux builds, pinned and checked)
        run: node scripts/fetch-bundled-apps.ts apps/desktop/src-tauri/bundled linux-x64
      - name: "Build (no bundle: the binary with host/, web/ and skills/ beside it)"
        working-directory: apps/desktop
        run: npx tauri build --no-bundle
      - name: Package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder makepkg --nodeps --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  windows:
    name: Windows (NSIS, MSI)
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps
      - name: Node.js for the gateway
        shell: bash
        run: |
          file=$(curl -fsSL "$NODE_DIST/SHASUMS256.txt" | awk '/win-x64.zip$/ {print $2}')
          curl -fsSLO "$NODE_DIST/$file"
          curl -fsSL "$NODE_DIST/SHASUMS256.txt" | grep " $file\$" | sha256sum -c -
          unzip -q "$file"
          mkdir -p apps/desktop/src-tauri/node
          cp "${file%.zip}/node.exe" apps/desktop/src-tauri/node/node.exe
          # npm from the same checked release, beside node.exe (node/npm/bin/npm-cli.js).
          cp -R "${file%.zip}/node_modules/npm" apps/desktop/src-tauri/node/npm
      - name: Original IeumOffice CLI resources (official Windows builds, pinned and checked; 7-Zip opens the installers)
        run: node scripts/fetch-bundled-apps.ts apps/desktop/src-tauri/bundled win32-x64
      - name: Native Windows Lightpanda with runtime DLLs and source provenance
        run: node scripts/fetch-bundled-lightpanda.ts apps/desktop/src-tauri/bundled
      - run: npm ci --ignore-scripts
      - name: Build once and package each Windows installer
        run: node scripts/release/build-windows.mjs
      # sec-vault round 2: the vault helper's caller check was never compiled for Windows before. Its
      # Rust tests, then the built binary + gateway against Windows Credential Manager in this runner's
      # throwaway account (planted made-up values only; scripts/sec-vault-native.ts).
      - name: Vault helper tests (Rust, Windows)
        working-directory: apps/desktop/src-tauri
        run: cargo test --release --locked --features tauri/custom-protocol --lib -- office_secrets gateway_caller --test-threads=1
      - name: Vault check with Windows Credential Manager (throwaway runner account)
        shell: bash
        run: node scripts/sec-vault-native.ts apps/desktop/src-tauri/target/release/achmage-workbench.exe apps/host/dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  macos:
    name: macOS (Apple silicon, dmg)
    needs: web
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps
      - name: Node.js for the gateway
        run: |
          file=$(curl -fsSL "$NODE_DIST/SHASUMS256.txt" | awk '/darwin-arm64.tar.gz$/ {print $2}')
          curl -fsSLO "$NODE_DIST/$file"
          curl -fsSL "$NODE_DIST/SHASUMS256.txt" | grep " $file\$" | shasum -a 256 -c -
          tar -xzf "$file"
          mkdir -p apps/desktop/src-tauri/node
          cp "${file%.tar.gz}/bin/node" apps/desktop/src-tauri/node/node
          # npm from the same checked release, beside node (node/npm/bin/npm-cli.js).
          cp -R "${file%.tar.gz}/lib/node_modules/npm" apps/desktop/src-tauri/node/npm
      - name: Original IeumOffice CLI resources (official Apple silicon builds, pinned and checked)
        run: node scripts/fetch-bundled-apps.ts apps/desktop/src-tauri/bundled darwin-arm64
      - run: npm ci --ignore-scripts
      - name: Build
        working-directory: apps/desktop
        # CLI engines use the same resources layout on every OS; no nested Electron .app.
        run: npx tauri build --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.macos.conf.json --bundles app,dmg
      # sec-vault round 2: the caller check on macOS (proc_pidinfo, the Keychain) at run time. A throwaway
      # keychain with a random password, made default for this runner's account only; then the Rust tests
      # and the built binary + gateway against it (planted made-up values only; scripts/sec-vault-native.ts).
      - name: Throwaway keychain for the vault checks
        run: |
          pw=$(openssl rand -hex 16)
          security create-keychain -p "$pw" wb-ci.keychain
          security list-keychains -d user -s wb-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s wb-ci.keychain
          security unlock-keychain -p "$pw" wb-ci.keychain
          security set-keychain-settings wb-ci.keychain
      - name: Vault helper tests (Rust, macOS)
        working-directory: apps/desktop/src-tauri
        run: cargo test --release --locked --features tauri/custom-protocol --lib -- office_secrets gateway_caller --test-threads=1
      - name: Vault check with the macOS Keychain (throwaway keychain)
        run: node scripts/sec-vault-native.ts apps/desktop/src-tauri/target/release/achmage-workbench apps/host/dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  smoke:
    name: First run on ${{ matrix.os }} (engines found, bundled document tools)
    # Only where the workflow runs at all (by hand or for a tag), stated for when triggers change.
    if: always() && needs.validate.result == 'success' && (inputs.smoke_run != '' || (needs.windows.result == 'success' && needs.macos.result == 'success'))
    needs: [validate, windows, macos]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.smoke_run && inputs.smoke_os == 'macos-15' && '{"include":[{"os":"macos-15","artifact":"macos"}]}' || inputs.smoke_run && inputs.smoke_os == 'windows-latest' && '{"include":[{"os":"windows-latest","artifact":"windows"}]}' || '{"include":[{"os":"windows-latest","artifact":"windows"},{"os":"macos-15","artifact":"macos"}]}') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify reused installer source
        if: inputs.smoke_run != ''
        shell: bash
        env:
          SOURCE_RUN: ${{ inputs.smoke_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          const { SOURCE_RUN, SOURCE_SHA, GITHUB_REPOSITORY, GH_TOKEN } = process.env;
          if (!/^\d+$/.test(SOURCE_RUN) || !/^[a-f0-9]{40}$/.test(SOURCE_SHA)) throw Error('Exact source run and SHA required');
          const response = await fetch(`https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}`, { headers: { authorization: `Bearer ${GH_TOKEN}` } });
          if (!response.ok) throw Error(`Source run lookup: ${response.status}`);
          const run = await response.json();
          if (run.head_sha !== SOURCE_SHA || run.head_repository?.full_name !== GITHUB_REPOSITORY || run.path !== '.github/workflows/release.yml' || run.status !== 'completed') throw Error('Wrong source build');
          writeFileSync('installer-source.json', JSON.stringify({ sourceRun: SOURCE_RUN, sourceSha: SOURCE_SHA, acceptanceSha: process.env.GITHUB_SHA }, null, 2));
          JS
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer
          run-id: ${{ inputs.smoke_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Record the exact installer used by acceptance
        env:
          SOURCE_RUN: ${{ inputs.smoke_run || github.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: node scripts/release/record-installer.ts installer smoke-out/installer-source.json "${{ matrix.artifact == 'windows' && '.exe' || '.dmg' }}"
      - name: Install for this user (NSIS, silent)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Achmage Workbench'
          Get-ChildItem $app | Select-Object Name
          "APP_DIR=$app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install from the disk image
        if: runner.os == 'macOS'
        run: |
          dmg=$(find installer -name '*.dmg' | head -1)
          hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/wb-dmg
          mkdir -p "$HOME/Applications"
          ditto "/tmp/wb-dmg/Achmage Workbench.app" "$HOME/Applications/Achmage Workbench.app"
          hdiutil detach /tmp/wb-dmg
          ls "$HOME/Applications/Achmage Workbench.app/Contents/Resources"
          echo "APP_DIR=$HOME/Applications/Achmage Workbench.app/Contents/Resources" >> "$GITHUB_ENV"
      - name: Install acceptance driver (no browser download)
        run: npm ci --ignore-scripts
      - name: First run with stand-in engines and automatic standalone Ieum setup
        shell: bash
        env:
          WORKBENCH_TEST_IEUM_INSTALL: '1'
        run: node scripts/setup-smoke.ts "$APP_DIR" smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.artifact }}
          path: smoke-out
          if-no-files-found: ignore

  upgrade:
    name: Windows installer upgrade and data preservation
    needs: [validate, windows]
    if: always() && needs.validate.result == 'success' && inputs.publish_run == '' && (inputs.upgrade_to != '' || inputs.upgrade_run != '' || needs.windows.result == 'success')
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      UPGRADE_FROM: ${{ inputs.upgrade_from || 'v0.5.1' }}
      UPGRADE_TO: ${{ inputs.upgrade_to }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install acceptance driver dependencies
        run: npm ci --ignore-scripts
      - name: Verify the existing upgrade candidate source
        if: inputs.upgrade_run != ''
        shell: bash
        env:
          SOURCE_RUN: ${{ inputs.upgrade_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node --input-type=module - <<'JS'
          import { mkdirSync, writeFileSync } from 'node:fs';
          const { SOURCE_RUN, SOURCE_SHA, GITHUB_REPOSITORY, GH_TOKEN } = process.env;
          if (!/^\d+$/.test(SOURCE_RUN) || !/^[a-f0-9]{40}$/.test(SOURCE_SHA)) throw Error('Exact source run and SHA required');
          const headers = { authorization: `Bearer ${GH_TOKEN}` };
          const base = `https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}`;
          const response = await fetch(base, { headers });
          if (!response.ok) throw Error(`Source run lookup: ${response.status}`);
          const run = await response.json();
          if (run.head_sha !== SOURCE_SHA || run.head_repository?.full_name !== GITHUB_REPOSITORY || run.path !== '.github/workflows/release.yml' || run.status !== 'completed') throw Error('Wrong source build');
          const jobsResponse = await fetch(`${base}/jobs`, { headers });
          if (!jobsResponse.ok) throw Error(`Source jobs lookup: ${jobsResponse.status}`);
          const jobs = (await jobsResponse.json()).jobs;
          if (!jobs.some(job => job.name === 'Windows (NSIS, MSI)' && job.conclusion === 'success')) throw Error('Windows installer build did not pass');
          mkdirSync('upgrade-out', { recursive: true });
          writeFileSync('upgrade-out/installer-source.json', JSON.stringify({ sourceRun: SOURCE_RUN, sourceSha: SOURCE_SHA, acceptanceSha: process.env.GITHUB_SHA }, null, 2));
          JS
      - name: Install the published old version and create real application data
        shell: pwsh
        run: |
          if ($env:UPGRADE_FROM -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$' -or ($env:UPGRADE_TO -and $env:UPGRADE_TO -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$')) { throw 'Invalid release tag' }
          gh release download $env:UPGRADE_FROM --repo $env:GITHUB_REPOSITORY --pattern '*-setup.exe' --dir old-installer
          if ($LASTEXITCODE -ne 0) { throw 'Old installer download failed' }
          $files = @(Get-ChildItem old-installer -Filter '*-setup.exe')
          if ($files.Count -ne 1) { throw 'Expected one old NSIS installer' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:UPGRADE_FROM" | ConvertFrom-Json
          $asset = @($release.assets | Where-Object name -eq $files[0].Name)
          $hash = 'sha256:' + (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLower()
          if ($release.draft -or $asset.Count -ne 1 -or $asset[0].digest -ne $hash) { throw 'Old published asset digest mismatch' }
          $installer = Start-Process -FilePath $files[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Old installation failed: $($installer.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Achmage Workbench'
          $fixture = Join-Path $env:RUNNER_TEMP "wb-upgrade-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force upgrade-out | Out-Null
          @{tag=$env:UPGRADE_FROM;sha256=$hash;version=(Get-Item (Join-Path $app 'achmage-workbench.exe')).VersionInfo.ProductVersion} | ConvertTo-Json | Set-Content upgrade-out/old-installer.json
          "APP_DIR=$app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "UPGRADE_FIXTURE=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          node scripts/upgrade-smoke.ts seed "$app" "$fixture" upgrade-out
          if ($LASTEXITCODE -ne 0) { throw 'Old application data preparation failed' }
      - uses: actions/download-artifact@v4
        if: inputs.upgrade_to == ''
        with:
          name: windows
          path: new-installer
          run-id: ${{ inputs.upgrade_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Record the exact upgrade installer
        if: inputs.upgrade_to == ''
        env:
          SOURCE_RUN: ${{ inputs.upgrade_run || github.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: node scripts/release/record-installer.ts new-installer upgrade-out/installer-source.json .exe
      - name: Install the new version over the same installation and verify
        shell: pwsh
        run: |
          if ($env:UPGRADE_TO) {
            gh release download $env:UPGRADE_TO --repo $env:GITHUB_REPOSITORY --pattern '*-setup.exe' --dir new-installer
            if ($LASTEXITCODE -ne 0) { throw 'New installer download failed' }
          }
          $files = @(Get-ChildItem new-installer -Recurse -Filter '*-setup.exe')
          if ($files.Count -ne 1) { throw 'Expected one new NSIS installer' }
          $hash = 'sha256:' + (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLower()
          if ($env:UPGRADE_TO) {
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:UPGRADE_TO" | ConvertFrom-Json
            $asset = @($release.assets | Where-Object name -eq $files[0].Name)
            if ($release.draft -or $asset.Count -ne 1 -or $asset[0].digest -ne $hash) { throw 'New published asset digest mismatch' }
          }
          $installer = Start-Process -FilePath $files[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "New installation failed: $($installer.ExitCode)" }
          @{tag=$env:UPGRADE_TO;sha256=$hash;version=(Get-Item (Join-Path $env:APP_DIR 'achmage-workbench.exe')).VersionInfo.ProductVersion} | ConvertTo-Json | Set-Content upgrade-out/new-installer.json
          node scripts/upgrade-smoke.ts verify "$env:APP_DIR" "$env:UPGRADE_FIXTURE" upgrade-out
          if ($LASTEXITCODE -ne 0) { throw 'Upgraded application verification failed' }
          Copy-Item (Join-Path $env:APP_DIR 'legacy-cleanup.json') upgrade-out/legacy-cleanup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-windows
          path: upgrade-out
          if-no-files-found: ignore

  update-proof:
    name: In-app update (${{ matrix.kind }})
    # Each OS's default kind: the candidate of this commit installed, its gateway replaced by the 0.0.1 test build,
    # then 업데이트 through that gateway's own route against a stand-in GitHub on 127.0.0.1 (scripts/release/update-proof.ts).
    needs: [validate, web, linux, windows, macos]
    if: always() && needs.web.result == 'success' && !inputs.publish_run && !inputs.upgrade_to && !inputs.smoke_run && !inputs.upgrade_run
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, kind: nsis, artifact: windows }
          - { os: macos-15, kind: dmg, artifact: macos }
          - { os: ubuntu-22.04, kind: appimage, artifact: linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: update-proof-kit
          path: update-proof-kit
      - name: Version of this candidate
        shell: bash
        run: |
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Install the candidate (NSIS, silent), then put the 0.0.1 test gateway in its place
        if: matrix.kind == 'nsis'
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed: $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Achmage Workbench'
          Copy-Item -Recurse -Force update-proof-kit/host/* (Join-Path $app 'host')
          "PROOF_HOST=$(Join-Path $app 'host')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROOF_APP=$(Join-Path $app 'achmage-workbench.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROOF_INSTALLER=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install the candidate from its disk image, then put the 0.0.1 test gateway in its place
        if: matrix.kind == 'dmg'
        run: |
          dmg=$(find installer -name '*.dmg' | head -1)
          hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/wb-dmg
          mkdir -p "$HOME/Applications"
          ditto "/tmp/wb-dmg/Achmage Workbench.app" "$HOME/Applications/Achmage Workbench.app"
          hdiutil detach /tmp/wb-dmg
          res="$HOME/Applications/Achmage Workbench.app/Contents/Resources"
          test -f "$res/install-kind.json"
          cp -R update-proof-kit/host/. "$res/host/"
          { echo "PROOF_HOST=$res/host"; echo "PROOF_APP=$HOME/Applications/Achmage Workbench.app/Contents/MacOS/achmage-workbench"; echo "PROOF_INSTALLER=$PWD/$dmg"; } >> "$GITHUB_ENV"
      - name: Place the candidate AppImage; the 0.0.1 test gateway runs beside it with the AppImage marker
        if: matrix.kind == 'appimage'
        run: |
          sudo apt-get update && sudo apt-get install -y libfuse2 xvfb libwebkit2gtk-4.1-0 libayatana-appindicator3-1
          image=$(find installer -name '*.AppImage' | head -1)
          mkdir -p "$HOME/Applications" proof-root
          cp "$image" "$HOME/Applications/Achmage.Workbench.AppImage" && chmod 755 "$HOME/Applications/Achmage.Workbench.AppImage"
          cp -R update-proof-kit/host proof-root/host
          printf '{"kind":"appimage"}\n' > proof-root/install-kind.json
          { echo "PROOF_HOST=$PWD/proof-root/host"; echo "PROOF_APP=$HOME/Applications/Achmage.Workbench.AppImage"; echo "PROOF_INSTALLER=$PWD/$image"; echo "PROOF_APPIMAGE=$HOME/Applications/Achmage.Workbench.AppImage"; } >> "$GITHUB_ENV"
      - name: 업데이트 through the old gateway (stand-in GitHub on 127.0.0.1)
        shell: bash
        run: |
          run=(node scripts/release/update-proof.ts --kind "${{ matrix.kind }}" --host "$PROOF_HOST" --installer "$PROOF_INSTALLER" --version "$NEW_VERSION" --key update-proof-kit/proof-key.pem --app-bin "$PROOF_APP" --out update-proof-out)
          if [ -n "${PROOF_APPIMAGE:-}" ]; then run+=(--appimage "$PROOF_APPIMAGE"); fi
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "${run[@]}"; else "${run[@]}"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-proof-${{ matrix.kind }}
          path: update-proof-out
          if-no-files-found: ignore

  candidate:
    name: Candidate files and installation receipts
    needs: [browser, web, linux, arch, windows, macos, smoke, upgrade, update-proof]
    if: always() && needs.linux.result == 'success' && needs.arch.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.update-proof.result == 'success'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect the built files and existing check outputs
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -D out -n windows -n macos -n linux -n arch
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -D out -p 'smoke-*' || true
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -D out/upgrade-windows -n upgrade-windows || true
          node scripts/release/collect-candidate.ts out candidate
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-provenance
          path: candidate
          if-no-files-found: error

  publish-tested:
    needs: validate
    name: Publish successful installers without rebuilding
    if: github.event_name == 'workflow_dispatch' && inputs.publish_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.publish_run }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PREVIEW_TAG: ${{ inputs.preview_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify source run and download its installers
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREVIEW_TAG" =~ ^(preview-[a-zA-Z0-9._-]+|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > run.json
          python3 - <<'PY'
          import json, os
          r = json.load(open('run.json'))
          assert r['head_sha'] == os.environ['SOURCE_SHA'], 'Source commit changed'
          assert r['status'] == 'completed' and r['conclusion'] == 'success', 'Run has not passed'
          assert r['path'] == '.github/workflows/release.yml', 'Wrong workflow'
          assert r['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY'], 'Wrong source repository'
          PY
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" -D out \
            -n windows -n macos -n linux -n arch \
            -n smoke-windows -n smoke-macos -n upgrade-windows -n candidate-provenance
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" -D out -p 'lightpanda-*'
      # The in-app update proofs are part of acceptance: a run where an OS's proof failed is not published.
      - name: The source run's in-app update proofs passed
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > jobs.json
          python3 - <<'PY'
          import json
          jobs = {j['name']: j['conclusion'] for j in json.load(open('jobs.json'))['jobs']}
          for kind in ('nsis', 'dmg', 'appimage'):
              assert jobs.get(f'In-app update ({kind})') == 'success', f'In-app update proof did not pass: {kind}'
          PY
      # Repository code (from source_sha) writes update.json from the real files. No key is in reach of this job;
      # signing is the separate sign-update job below, which runs no repository code (security review H1).
      - name: Verify installed candidate bytes and write update.json (no key here)
        run: |
          node scripts/release/promote.ts prepare out out/candidate-provenance/installer-provenance.json release-files
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release-files
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: startsWith(inputs.preview_tag, 'v')
        with:
          name: update-json
          path: release-files/update.json
          if-no-files-found: error
          retention-days: 3

  # Signs update.json with the release key. No checkout, no repository script, no npm/npx, no third-party action:
  # only the pinned download/upload actions and the runner's own node, inline. It refuses unless the release tag
  # points at exactly source_sha and this run's ref (whose workflow file this is) is a release/v* branch or that tag.
  # What this stops: repository code (promote.ts, a test, a build step) reading the key. What it does NOT stop:
  # someone who can push code to a release/v* branch or a v* tag and run this workflow can still get THAT code's
  # update.json signed (protect those refs and keep the key in a protected Environment for that).
  sign-update:
    needs: [validate, publish-tested]
    name: Sign update.json (release key; no repository code)
    if: github.event_name == 'workflow_dispatch' && inputs.publish_run != '' && startsWith(inputs.preview_tag, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PREVIEW_TAG: ${{ inputs.preview_tag }}
    steps:
      - name: Refuse unless the tag is source_sha and this run's ref is a release branch or that tag
        run: |
          [[ "$PREVIEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Only a vMAJOR.MINOR.PATCH release is signed"; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::An exact source commit is required"; exit 1; }
          case "$GITHUB_REF" in
            "refs/tags/$PREVIEW_TAG"|refs/heads/release/v*) ;;
            *) echo "::error::Signing runs only from a release/v* branch or the release tag (this run: $GITHUB_REF)"; exit 1 ;;
          esac
          obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$PREVIEW_TAG" --jq '.object.type + " " + .object.sha')
          for depth in 1 2 3 4 5; do
            set -- $obj
            [ "$1" = tag ] || break
            obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$2" --jq '.object.type + " " + .object.sha')
          done
          set -- $obj
          { [ "$1" = commit ] && [ "$2" = "$SOURCE_SHA" ]; } || { echo "::error::The release tag does not point to source_sha"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: update-json
          path: update
      - name: Sign update.json (ed25519 over its exact bytes)
        env:
          WORKBENCH_UPDATE_SIGNING_KEY: ${{ secrets.WORKBENCH_UPDATE_SIGNING_KEY }}
        run: |
          set +x
          if [ -z "${WORKBENCH_UPDATE_SIGNING_KEY:-}" ]; then echo "::error::WORKBENCH_UPDATE_SIGNING_KEY is missing: the release is not published without a signed update.json"; exit 1; fi
          node -e 'const c = require("node:crypto"), f = require("node:fs"); const k = c.createPrivateKey(process.env.WORKBENCH_UPDATE_SIGNING_KEY); if (k.asymmetricKeyType !== "ed25519") { console.error("not an ed25519 key"); process.exit(1); } const b = f.readFileSync("update/update.json"); if (JSON.parse(b.toString("utf8")).version !== process.env.PREVIEW_TAG.slice(1)) { console.error("update.json is not for this tag"); process.exit(1); } f.writeFileSync("update/update.json.sig", c.sign(null, b, k).toString("base64") + "\n", { flag: "wx" });' > /dev/null
          test -s update/update.json.sig
      - uses: actions/upload-artifact@v4
        with:
          name: update-json-sig
          path: update/update.json.sig
          if-no-files-found: error
          retention-days: 3

  publish-upload:
    needs: [validate, publish-tested, sign-update]
    name: Check the signature and upload to the prepared draft
    if: always() && needs.publish-tested.result == 'success' && (needs.sign-update.result == 'success' || (needs.sign-update.result == 'skipped' && startsWith(inputs.preview_tag, 'preview-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.publish_run }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PREVIEW_TAG: ${{ inputs.preview_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files
      - uses: actions/download-artifact@v4
        if: startsWith(inputs.preview_tag, 'v')
        with:
          name: update-json-sig
          path: release-files
      # No key here: the signature is checked against the app's own key list and the files, then uploaded.
      - name: Verify update.json.sig and upload to the prepared draft
        run: |
          node scripts/release/promote.ts upload release-files
