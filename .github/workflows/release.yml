# Installers for Windows, macOS (Apple silicon), Linux (AppImage and .deb) and Arch Linux /
# CachyOS (.pkg.tar.zst). The UI and the gateway are the same everywhere, so they are built once
# on Linux (with the IeumOffice editors and the xlsx engine's WebAssembly) and every platform
# then builds only its desktop shell around them. Windows, macOS and the AppImage carry their own
# Node.js 24 for the gateway; the Arch package uses the system's.
# Runs by hand (Actions › release › Run workflow) or for a version tag (v*), which also makes a
# GitHub release with the installers.

name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NODE_DIST: https://nodejs.org/dist/latest-v24.x

jobs:
  web:
    name: UI and gateway (once)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: npm ci --ignore-scripts
      - name: Build (IeumOffice checkout, xlsx engine, UI, editors, gateway)
        run: npm run build
      - name: Typecheck and tests
        run: |
          npm run typecheck
          npx vitest run
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            apps/web/dist
            apps/host/dist
          if-no-files-found: error

  linux:
    name: Linux (AppImage, deb)
    needs: web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps
      - name: Node.js for the gateway
        run: |
          file=$(curl -fsSL "$NODE_DIST/SHASUMS256.txt" | awk '/linux-x64.tar.xz$/ {print $2}')
          curl -fsSLO "$NODE_DIST/$file"
          curl -fsSL "$NODE_DIST/SHASUMS256.txt" | grep " $file\$" | sha256sum -c -
          tar -xJf "$file"
          mkdir -p apps/desktop/src-tauri/node
          cp "${file%.tar.xz}/bin/node" apps/desktop/src-tauri/node/node
      - run: npm ci --ignore-scripts
      - name: Build
        working-directory: apps/desktop
        run: npx tauri build --config src-tauri/tauri.release.conf.json --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  arch:
    name: Arch Linux / CachyOS (pacman)
    needs: web
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: System packages
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm rust webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg openssl
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps
      - run: npm ci --ignore-scripts
      - name: "Build (no bundle: the binary with host/ and web/ beside it)"
        working-directory: apps/desktop
        run: npx tauri build --no-bundle
      - name: Package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder makepkg --nodeps --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  windows:
    name: Windows (NSIS, MSI)
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps
      - name: Node.js for the gateway
        shell: bash
        run: |
          file=$(curl -fsSL "$NODE_DIST/SHASUMS256.txt" | awk '/win-x64.zip$/ {print $2}')
          curl -fsSLO "$NODE_DIST/$file"
          curl -fsSL "$NODE_DIST/SHASUMS256.txt" | grep " $file\$" | sha256sum -c -
          unzip -q "$file"
          mkdir -p apps/desktop/src-tauri/node
          cp "${file%.zip}/node.exe" apps/desktop/src-tauri/node/node.exe
      - run: npm ci --ignore-scripts
      - name: Build
        working-directory: apps/desktop
        run: npx tauri build --config src-tauri/tauri.release.conf.json --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  macos:
    name: macOS (Apple silicon, dmg)
    needs: web
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps
      - name: Node.js for the gateway
        run: |
          file=$(curl -fsSL "$NODE_DIST/SHASUMS256.txt" | awk '/darwin-arm64.tar.gz$/ {print $2}')
          curl -fsSLO "$NODE_DIST/$file"
          curl -fsSL "$NODE_DIST/SHASUMS256.txt" | grep " $file\$" | shasum -a 256 -c -
          tar -xzf "$file"
          mkdir -p apps/desktop/src-tauri/node
          cp "${file%.tar.gz}/bin/node" apps/desktop/src-tauri/node/node
      - run: npm ci --ignore-scripts
      - name: Build
        working-directory: apps/desktop
        run: npx tauri build --config src-tauri/tauri.release.conf.json --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: GitHub release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, arch, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # The installers' names have a space ("Achmage Workbench_…"): kept whole, not split into words.
        run: |
          mapfile -t files < <(find out -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.pkg.tar.zst' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \))
          test "${#files[@]}" -eq 6
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Achmage Workbench $GITHUB_REF_NAME" --generate-notes "${files[@]}"
