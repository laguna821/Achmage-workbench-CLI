name: Lightpanda Windows compile preflight
on:
  workflow_dispatch:
  push:
    branches: [feat/lightpanda-windows-native]
    paths:
      - '.github/workflows/lightpanda-windows-preflight.yml'
      - 'third_party/lightpanda-windows/*.patch'
      - 'third_party/lightpanda-windows/source.json'
      - 'scripts/lightpanda-windows.ps1'
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/prepare-lightpanda-windows.py native-source
      - run: ./scripts/lightpanda-windows.ps1 setup
      - uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: |
            native-source/browser/.zig-cache
            native-source/browser/zig-pkg
            ~/AppData/Local/zig
          key: lp-win-browser-1.0.2-zig0.17.0-${{ hashFiles('third_party/lightpanda-windows/browser.patch') }}
          restore-keys: lp-win-browser-1.0.2-zig0.17.0-
      - name: Record installed CRT symbols
        run: |
          dumpbin /symbols "$env:LP_MSVC_LIB_X64/msvcrt.lib" > native-evidence/msvcrt-symbols.txt
          if ($LASTEXITCODE -ne 0) { throw 'CRT inspection failed' }
      - name: Check browser compilation while the real V8 build runs separately
        working-directory: native-source/browser
        run: |
          # `zig build check` builds static analysis libraries, never an executable.
          # The empty archive skips only the expensive V8 link dependency. This is
          # compile diagnostics, not native runtime acceptance or a shipped artifact.
          zig ar rcs diagnostic-empty.lib
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic archive creation failed' }
          Invoke-WebRequest 'https://sqlite.org/2026/sqlite-amalgamation-3530200.zip' -OutFile "$env:RUNNER_TEMP/sqlite.zip"
          Expand-Archive "$env:RUNNER_TEMP/sqlite.zip" "$env:RUNNER_TEMP/sqlite"
          $sqlite = Get-ChildItem "$env:RUNNER_TEMP/sqlite" -Directory | Select-Object -First 1
          zig fetch $sqlite.FullName
          if ($LASTEXITCODE -ne 0) { throw 'SQLite prefetch failed' }
          zig build check -Doptimize=ReleaseFast -Dcpu=x86_64 '-Dprebuilt_v8_path=diagnostic-empty.lib' --summary all 2>&1 | Tee-Object ../../native-evidence/compile-check.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows compile preflight failed' }
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.browser-cache.outputs.cache-primary-key != '' && steps.browser-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            native-source/browser/.zig-cache
            native-source/browser/zig-pkg
            ~/AppData/Local/zig
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightpanda-windows-compile-diagnostics
          path: native-evidence
          if-no-files-found: ignore
