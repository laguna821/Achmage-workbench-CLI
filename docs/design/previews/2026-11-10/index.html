<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workbench — HIG 변경 화면</title>
<style>
@font-face{font-family:Pretendard;src:url('../../../../apps/web/public/fonts/pretendard/PretendardVariable.ttf') format('truetype');font-weight:45 920;font-display:swap}
:root{color-scheme:light dark;font-family:Pretendard,system-ui,sans-serif;background:#f2f2f7;color:#1c1c1e}
*{box-sizing:border-box}body{margin:0}header{padding:24px max(20px,calc((100vw - 1440px)/2));background:#fff;border-bottom:1px solid #d1d1d6}h1{font-size:22px;line-height:1.4;margin:0 0 8px}p{font-size:15px;line-height:1.6;margin:0;color:#55555c}.controls{display:flex;align-items:end;flex-wrap:wrap;gap:16px;margin-top:20px}label{display:grid;gap:6px;font-size:13px;font-weight:600}select,a{font:inherit}select{min-height:40px;min-width:140px;padding:6px 32px 6px 12px;border:1px solid #c7c7cc;border-radius:8px;background:#fff;color:inherit}a{color:#0067c9}.controls a{padding:10px 0}main{max-width:1480px;margin:0 auto;padding:20px}figure{margin:0}figcaption{font-size:15px;line-height:1.6;margin-bottom:16px}img{display:block;max-width:100%;height:auto;margin:auto;border:1px solid #c7c7cc;border-radius:12px;box-shadow:0 4px 18px #0000000c}.note{font-size:13px;margin-top:16px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #007aff;outline-offset:3px}
@media(prefers-color-scheme:dark){:root{background:#1c1c1e;color:#f2f2f7}header{background:#242426;border-color:#48484a}p{color:#c7c7cc}select{background:#303032;border-color:#636366}a{color:#72b7ff}img{border-color:#48484a}}
</style>
<header>
  <h1>Workbench — HIG 변경 화면</h1>
  <p>실제 프론트엔드를 임시 프로젝트·대화 데이터로 실행한 화면입니다. 2026년 11월 10일 소스 기준입니다.</p>
  <div class="controls">
    <label>화면<select id="scene">
      <option value="images">채팅 속 이미지</option><option value="chat">세션 대화</option><option value="home">시작 화면</option><option value="project">프로젝트와 속성</option><option value="grid">9개 작업 보기</option><option value="links">작업 간 요청 전달</option><option value="search">본문 검색</option><option value="editor">문서 편집기</option><option value="narrow">좁은 창</option><option value="large-text">글자 200% 확대</option>
    </select></label>
    <label>외형<select id="theme"><option value="light">라이트</option><option value="dark">다크</option></select></label>
    <a id="original" href="images-light.png" target="_blank" rel="noopener">원본 크기로 보기 ↗</a>
    <a href="../../2026-11-10-hig-remake-result.md">구현·확인 범위</a>
  </div>
</header>
<main>
  <figure><figcaption id="caption"></figcaption><img id="capture" src="images-light.png" alt="Workbench 채팅 본문에 첨부 이미지가 표시된 라이트 화면"></figure>
  <p class="note">이 페이지는 화면 검토용입니다. 제품 조작은 실행하지 않습니다. Chromium 미리보기이므로 Windows WebView2·macOS WKWebView·Linux WebKitGTK의 네이티브 동작 확인을 대신하지 않습니다.</p>
</main>
<script>
const captions={images:'이미지를 대화 본문에서 확인하고 눌러 확대합니다. 텍스트와 이미지가 같은 대화 흐름에 남습니다.',chat:'사용자 요청과 AI 답변을 구분하고, 긴 본문은 읽기 폭을 제한합니다. 작업 로그와 보조 도구는 필요할 때 펼칩니다.',home:'중앙 입력부와 최근 프로젝트로 시작합니다. 네이티브 브라우저가 없는 이 미리보기에서는 Ask만 표시되며, Search는 해당 기능이 있는 앱에서 제공됩니다.',project:'프로젝트를 누르면 속성 개요로 바로 이동합니다. 채팅·웹 AI·문서 AI·문서는 종류별로 구분합니다.',grid:'프로젝트와 대화를 9개 칸으로 봅니다. 작은 칸은 입력부를 줄이고, 확대하면 전체 도구가 다시 나타납니다.',links:'보내는 대화와 받는 대화를 선택해 요청을 전달합니다. 기존 호스트의 실제 handoff 경로와 요청 내역을 사용합니다.',search:'세션 프롬프트와 AI 대화 결과를 구분해 찾고, 해당 대화로 이동합니다.',editor:'마크다운 편집기의 실제 메뉴와 AI 도우미에도 중립 색상과 Pretendard를 적용했습니다. 문서에 지정된 서식은 유지합니다.',narrow:'744px 창에서는 사이드바가 접히고 필요할 때 서랍으로 열립니다.', 'large-text':'루트 글자를 200%로 확대하면 상단 맥락 도구가 추가 줄로 배치되어 서로 겹치지 않습니다.'};
const scene=document.getElementById('scene'),theme=document.getElementById('theme');
function render(){const file=scene.value+'-'+theme.value+'.png';document.getElementById('capture').src=file;document.getElementById('capture').alt='Workbench '+scene.selectedOptions[0].text+' — '+theme.selectedOptions[0].text;document.getElementById('original').href=file;document.getElementById('caption').textContent=captions[scene.value]}
scene.addEventListener('change',render);theme.addEventListener('change',render);render();
</script>
</html>
